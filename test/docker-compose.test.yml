# E2E test stack: the app (mock LLM, fresh DB) + a Playwright runner.
# Run from the repo root:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
services:
  # Not named "app": Chromium HSTS-preloads the .app TLD and forces https://app:8000.
  finally:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally-test
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
    # No named volume: every run starts from a clean, freshly seeded database.
    tmpfs:
      - /app/db
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  playwright:
    # Keep this tag in sync with @playwright/test in test/package.json.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /work
    depends_on:
      finally:
        condition: service_healthy
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    volumes:
      - ./:/work
      - /work/node_modules  # keep host node_modules out of the container
    ipc: host
    command: sh -c "npm ci && npx playwright test"
